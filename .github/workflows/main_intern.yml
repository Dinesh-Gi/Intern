name: Deploy Backend to Windows App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-intern-windows.yml'

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: intern
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # TypeScript validation
      - name: Check TypeScript
        working-directory: backend
        run: npm run check

      # Run application tests
      - name: Run tests
        working-directory: backend
        run: npm test

      # Compile TypeScript
      - name: Build application
        working-directory: backend
        run: npm run build

      # Verify deployment files
      - name: Verify deployment files
        working-directory: backend
        shell: pwsh
        run: |
          if (!(Test-Path "dist/server.js")) {
            throw "Build failed: dist/server.js not found"
          }

          if (!(Test-Path "web.config")) {
            throw "web.config not found in backend folder"
          }

          Write-Host "Deployment files verified successfully."

      # Deploy to Windows Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_WINDOWS_PUBLISH_PROFILE }}
          package: backend
