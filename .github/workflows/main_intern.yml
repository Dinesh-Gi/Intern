
name: Deploy Backend to Windows App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-intern-windows.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: intern
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check TypeScript
        working-directory: backend
        run: npm run check

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Build application
        working-directory: backend
        run: npm run build

      - name: Verify deployment files
        working-directory: backend
        shell: pwsh
        run: |
          if (!(Test-Path "dist/server.js")) {
            throw "dist/server.js not found"
          }

          if (!(Test-Path "web.config")) {
            throw "web.config not found"
          }

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: intern-backend
          path: backend/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: intern-backend
          path: ./backend

      - name: Deploy to Windows App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: intern
          publish-profile: ${{ secrets.AZURE_BACKEND_WINDOWS_PUBLISH_PROFILE }}
          package: ./backend
